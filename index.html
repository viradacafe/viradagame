img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand-text);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{position:relative;z-index:1;min-height:100%}

/* ---------- estande ---------- */
.stand{max-width:560px;margin:0 auto;padding:16px 20px 28px;display:flex;flex-direction:column;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.logo{height:64px;width:auto;display:block}
.logo-lg{height:120px;width:auto;display:block;margin:0 auto}
.demo{font-size:.8rem;color:var(--warn);background:var(--warn-bg);padding:4px 10px;border-radius:999px}
.main{flex:1;display:flex;flex-direction:column;gap:18px;padding-top:8px}
h1,h2,.display{font-family:var(--display);font-weight:600;letter-spacing:-.01em;line-height:1.1;margin:0}
h1{font-size:clamp(2rem,8vw,2.75rem)}
.lead{margin:0;color:var(--ink-soft);max-width:34ch}
.btn{appearance:none;border:3px solid var(--line);background:var(--card);color:var(--ink);font-family:var(--display);font-weight:600;font-size:1.25rem;min-height:60px;padding:10px 22px;border-radius:18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;touch-action:manipulation;transition:transform .12s}
.btn:active{transform:translateY(2px)}
.btn-primary{background:var(--brand);color:var(--on-brand);box-shadow:0 5px 0 var(--line)}
.btn-primary:active{box-shadow:0 2px 0 var(--line);transform:translateY(3px)}
.btn[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none;transform:none}
.btn-block{width:100%}
.btn-ghost{border-color:transparent;background:transparent;text-decoration:underline;text-underline-offset:4px;min-height:48px;font-family:var(--body);font-weight:700;font-size:1.05rem}
.stack{display:flex;flex-direction:column;gap:12px}
.notice{border:2px dashed var(--line);border-radius:16px;padding:14px 16px;background:var(--surface);margin:0}

.wheel-wrap{position:relative;width:min(88vw,440px);aspect-ratio:1;margin:6px auto 4px}
.wheel-rot{width:100%;height:100%;transform:rotate(0deg);will-change:transform}
.wheel-rot svg{width:100%;height:100%;display:block;overflow:visible}
.pointer{position:absolute;left:50%;top:-14px;transform:translateX(-50%);width:44px;height:52px;z-index:2;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
.hub{position:absolute;left:50%;top:50%;width:24%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:var(--card);border:4px solid var(--line);display:grid;place-items:center;z-index:2}
.hub img{width:72%}
.wheel-wrap.dim{opacity:.55}
.slice-win{animation:win .5s ease-in-out 2}
@keyframes win{50%{opacity:.55}}

.status{display:inline-flex;align-items:center;gap:8px;font-weight:700;padding:6px 14px;border-radius:999px;font-size:1rem;align-self:flex-start;border:2px solid currentColor}
.status::before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor}
.s-pending{color:var(--warn);background:var(--warn-bg)}
.s-ready{color:var(--ok);background:var(--ok-bg)}
.s-done{color:var(--ink-soft);background:var(--surface)}
.s-cancel{color:var(--danger);background:var(--danger-bg)}
.kicker{margin:0;font-family:var(--display);font-size:1.3rem;color:var(--brand-text);font-weight:600}
.question{margin:0;font-family:var(--display);font-weight:500;font-size:clamp(1.55rem,6.2vw,2rem);line-height:1.2;border-left:8px solid var(--brand);padding:4px 0 4px 16px}
.prize{display:flex;align-items:center;gap:14px;background:var(--surface);border:3px solid var(--line);border-radius:20px;padding:14px 16px}
.prize svg{flex:none;width:56px;height:56px}
.prize p{margin:0}
.prize strong{display:block;font-family:var(--display);font-size:1.6rem;font-weight:600;line-height:1.1}
.codebox{text-align:center;border:3px dashed var(--line);border-radius:20px;padding:14px;background:var(--card)}
.codebox .label{font-size:.95rem;color:var(--ink-soft);margin:0}
.code{font-family:var(--display);font-weight:700;font-size:clamp(2.4rem,12vw,3.4rem);letter-spacing:.06em;line-height:1.1}
.ready-hero{background:var(--brand);color:var(--on-brand);border:3px solid var(--line);border-radius:24px;padding:22px 20px;box-shadow:0 6px 0 var(--line)}
.ready-hero h1{font-size:clamp(2.3rem,10vw,3.2rem)}

.qr{background:#fff;padding:14px;border-radius:16px;border:3px solid var(--line);width:max-content;margin:0 auto}
.qr img,.qr canvas{display:block;width:220px;height:220px}
.url{word-break:break-all;text-align:center;color:var(--ink-soft);margin:0}
.foot{display:flex;justify-content:center;padding-top:18px}
.foot button{background:none;border:0;color:var(--muted-ink);font-size:.9rem;text-decoration:underline;padding:10px;cursor:pointer}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700}
.field .hint{font-size:.9rem;color:var(--ink-soft)}
.input{border:3px solid var(--line);border-radius:14px;background:var(--card);min-height:56px;padding:10px 14px;font-size:1.15rem;width:100%}
.check{display:flex;gap:12px;align-items:flex-start;font-size:1.05rem}
.check input{width:28px;height:28px;flex:none;margin-top:2px;accent-color:var(--brand)}
.err{color:var(--danger);font-weight:700;margin:0}

/* ---------- equipe ---------- */
.panel{max-width:980px;margin:0 auto;padding:12px 16px 40px}
.phead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;border-bottom:3px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.phead h1{font-size:1.6rem;flex:1;min-width:10ch}
.btn-sm{min-height:48px;font-size:1.05rem;padding:6px 16px;border-radius:14px;box-shadow:none}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px}
.tab{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;min-height:44px;font-weight:700;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.sec{margin-top:18px}
.sec h2{font-size:1.35rem;margin-bottom:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.pcard{border:3px solid var(--line);border-radius:18px;background:var(--card);padding:14px;display:flex;flex-direction:column;gap:8px}
.pcard.here{outline:4px solid var(--brand);outline-offset:2px}
.pcard.old{background:var(--warn-bg)}
.pcard .code{font-size:2rem}
.pcard .meta{margin:0;color:var(--ink-soft);font-size:1rem}
.pcard .row{display:flex;gap:8px;flex-wrap:wrap}
.pcard .row .btn{flex:1}
.btn-ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn-danger{color:var(--danger);border-color:var(--danger);background:var(--card)}
.empty{color:var(--ink-soft);border:2px dashed var(--muted-ink);border-radius:16px;padding:18px;margin:0}
.search{display:flex;gap:8px;max-width:520px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;background:var(--card);border:3px solid var(--line);border-radius:16px;overflow:hidden}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--muted)}
th{font-size:.95rem;color:var(--ink-soft)}
td input{width:110px;min-height:48px}
.num{font-variant-numeric:tabular-nums;font-weight:700}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.9rem;font-weight:700}
.chip-ok{background:var(--ok-bg);color:var(--ok)}
.chip-no{background:var(--danger-bg);color:var(--danger)}
.chip-warn{background:var(--warn-bg);color:var(--warn)}
.wrow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--muted)}
.wrow input[type=range]{width:100%;accent-color:var(--brand);height:36px}
.wrow .pct{font-weight:700;font-variant-numeric:tabular-nums;min-width:9ch;text-align:right}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.box{border:3px solid var(--line);border-radius:18px;padding:16px;background:var(--card)}
.box h3{margin:0 0 6px;font-family:var(--display);font-weight:600;font-size:1.2rem}
.box p{margin:0 0 10px}
.lock{max-width:420px;margin:12vh auto 0;padding:0 20px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:14px;font-weight:700;z-index:50;max-width:90vw}
details summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
@media (prefers-reduced-motion: reduce){ .slice-win{animation:none} .btn{transition:none} }
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<div id="toast" class="toast" role="status" hidden></div>
<script>

function mergeCfg(c){const d=clone(DEFAULT_CFG);if(!c)return d;const o=Object.assign(d,clone(c));

function rnd(){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296;}
const ALPH="ACDEFHJKMNPRTUVWXY3479";
function newCode(taken){for(let t=0;t<50;t++){let s="";const a=new Uint32Array(4);crypto.getRandomValues(a);for(const x of a)s+=ALPH[x%ALPH.length];const c="VNC-"+s;if(!taken.has(c))return c;}return "VNC-"+Date.now().toString(36).toUpperCase().slice(-5);}
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("virada:"+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
function ago(t){const m=Math.round((Date.now()-t)/60000);if(m<1)return "agora";if(m<60)return "há "+m+" min";const h=Math.floor(m/60);return "há "+h+" h "+(m%60)+" min";}
function hhmm(t){return new Date(t).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});}

// db compartilhado (claude.ai) com reserva local para teste fora do Claude
function localStore(){
  const KEY="roleta-virada-demo";let data;
  try{data=JSON.parse(localStorage.getItem(KEY))||null}catch(e){}
  data=data||{cfg:null,parts:{},contacts:[]};
  const L={cfg:[],parts:[],contacts:[]};
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}emit()};
  const emit=()=>{L.cfg.forEach(f=>f(data.cfg));const p=Object.values(data.parts).sort((a,b)=>b.createdAt-a.createdAt);L.parts.forEach(f=>f(p));L.contacts.forEach(f=>f(data.contacts.slice().reverse()));};
  addEventListener("storage",e=>{if(e.key===KEY){try{data=JSON.parse(e.newValue)||data}catch(x){}emit()}});
  return {mode:"local",
    watchConfig(f){L.cfg.push(f);setTimeout(()=>f(data.cfg))},
    watchParts(f){L.parts.push(f);setTimeout(emit)},
    watchContacts(f){L.contacts.push(f);setTimeout(emit)},
    async saveConfig(c){data.cfg=clone(c);save()},
    async createPart(p){data.parts[p.code]=clone(p);save()},
    async getPart(c){return data.parts[c]?clone(data.parts[c]):null},
    async updatePart(c,patch){if(!data.parts[c])throw{code:"invalid_argument"};Object.assign(data.parts[c],patch);save()},
    async lock(){return true},
    async addContact(c){data.contacts.push(clone(c));save()},
    async wipe(){data.parts={};data.contacts=[];save()}
  };
}
function dbStore(db){
  const cfgRef=db.doc("config/main"),parts=db.collection("participations"),contacts=db.collection("contacts");
  const onErr=e=>{if(e&&e.code==="revoked")toast("O acesso aos dados foi encerrado nesta tela.");};
  return {mode:"db",
    watchConfig(f){cfgRef.onSnapshot(s=>f(s.exists?s.data():null),onErr)},
    watchParts(f){parts.orderBy("createdAt","desc").limit(1000).onSnapshot(s=>f(s.docs.map(d=>d.data())),onErr)},
    watchContacts(f){contacts.orderBy("createdAt","desc").limit(1000).onSnapshot(s=>f(s.docs.map(d=>d.data())),onErr)},
    async saveConfig(c){await cfgRef.set(clone(c))},
    async createPart(p){await parts.doc(p.code).set(clone(p))},
    async getPart(c){const s=await parts.doc(c).get();return s.exists?clone(s.data()):null},
    async updatePart(c,patch){await parts.doc(c).update(patch)},
    async lock(c){try{const r=await parts.doc(c).acquire({holder:TAB,ttlMs:5000});return r.acquired}catch(e){return true}},
    async addContact(c){await contacts.add(clone(c))},
    async wipe(){
      const [a,b]=await Promise.all([parts.get(),contacts.get()]);
      for(const d of a.docs)await parts.doc(d.id).delete();
      for(const d of b.docs)await contacts.doc(d.id).delete();
    }
  };
}

function stats(){
  const out={};
  for(const k in PRIZES){
    const ps=S.parts.filter(p=>p.prize===k);
    const delivered=ps.filter(p=>p.status==="delivered").length;
    const reserved=ps.filter(p=>p.status==="pending"||p.status==="validated").length;
    const stock=Math.max(0,Number(S.cfg.stock[k])||0);
    const saldo=stock-delivered;
    out[k]={stock,delivered,reserved,saldo,avail:Math.max(0,saldo-reserved)};
  }
  return out;
}
function drawState(){
  const st=stats();
  const totalStock=Object.values(st).reduce((a,b)=>a+b.stock,0);
  const totalDelivered=Object.values(st).reduce((a,b)=>a+b.delivered,0);
  const totalSaldo=Object.values(st).reduce((a,b)=>a+Math.max(0,b.saldo),0);
  const active=MISSIONS.filter(m=>st[m.prize].avail>0&&(Number(S.cfg.weights[m.id])||0)>0);
  const sumW=active.reduce((a,m)=>a+Number(S.cfg.weights[m.id]),0);
  let block=null;
  if(totalStock===0&&totalDelivered===0)block="setup";
  else if(totalSaldo<=0)block="over";
  else if(S.cfg.paused)block="paused";
  else if(!active.length)block="reserved";
  return {st,active,sumW,block};
}
function pick(ds){let r=rnd()*ds.sumW;for(const m of ds.active){r-=Number(S.cfg.weights[m.id]);if(r<0)return m;}return ds.active[ds.active.length-1];}
function partByCode(c){return S.parts.find(p=>p.code===c)||null;}

/* ================= cor da marca ================= */
function lum(hex){const n=parseInt(hex.slice(1),16);const c=[n>>16&255,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2];}
function contrast(a,b){const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}
function shade(hex,f){const n=parseInt(hex.slice(1),16);const c=[n>>16&255,n>>8&255,n&255].map(v=>Math.round(v*f));return "#"+c.map(v=>v.toString(16).padStart(2,"0")).join("");}
function applyBrand(){
  let p=S.cfg.colors.primary;if(!/^#[0-9a-f]{6}$/i.test(p))p="#FD870C";
  const r=document.documentElement.style;r.setProperty("--brand",p);r.setProperty("--slice-a",p);
  r.setProperty("--on-brand",contrast(p,"#2A1A0F")>=contrast(p,"#FFFFFF")?"#2A1A0F":"#FFFFFF");
  r.setProperty("--slice-a-ink",contrast(p,"#2A1A0F")>=contrast(p,"#FFFFFF")?"#2A1A0F":"#FFFFFF");
  let t=p,f=1;while(contrast(t,"#FFFFFF")<4.8&&f>.3){f-=.05;t=shade(p,f);}
  const dark=matchMedia("(prefers-color-scheme: dark)").matches;
  if(!dark)r.setProperty("--brand-text",t);else r.removeProperty("--brand-text");
}
function logoSrc(){return S.cfg.logoId?"/_blob/"+S.cfg.logoId:IMG.logo;}

/* ================= roleta (SVG) ================= */
function pt(a,r){const rad=a*Math.PI/180;return [250+r*Math.sin(rad),250-r*Math.cos(rad)];}
function wheelSVG(st){
  const R=236;let s='<svg viewBox="0 0 500 500" role="img" aria-label="Roleta com seis missões"><defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="var(--muted)"/><line x1="0" y1="0" x2="0" y2="12" stroke="var(--muted-ink)" stroke-width="3" opacity=".35"/></pattern></defs>';
  s+='<circle cx="250" cy="250" r="'+(R+8)+'" fill="var(--line)"/>';
  MISSIONS.forEach((m,i)=>{
    const a0=i*60,a1=a0+60,[x0,y0]=pt(a0,R),[x1,y1]=pt(a1,R);
    const out=st[m.prize].avail<=0||(Number(S.cfg.weights[m.id])||0)<=0;
    const tier={mini:"a",medio:"b",chaveiro:"c"}[m.prize];
    const fill=out?"url(#hatch)":"var(--slice-"+tier+")",ink=out?"var(--muted-ink)":"var(--slice-"+tier+"-ink)";
    s+='<path id="sl'+i+'" d="M250 250 L'+x0.toFixed(1)+' '+y0.toFixed(1)+' A'+R+' '+R+' 0 0 1 '+x1.toFixed(1)+' '+y1.toFixed(1)+' Z" fill="'+fill+'" stroke="var(--line)" stroke-width="4" stroke-linejoin="round"/>';
    const ac=a0+30,[tx,ty]=pt(ac,148);
    const sub=out?(st[m.prize].saldo<=0?"Esgotado":"Fora do sorteio"):PRIZES[m.prize].name;
    s+='<g transform="translate('+tx.toFixed(1)+' '+ty.toFixed(1)+') rotate('+(ac-90)+')" fill="'+ink+'" text-anchor="middle" font-family="Fredoka, Trebuchet MS, sans-serif">';
    s+='<text y="-16" font-size="21" font-weight="600">'+esc(m.lines[0])+'</text><text y="6" font-size="21" font-weight="600">'+esc(m.lines[1])+'</text>';
    s+='<text y="31" font-size="15" font-weight="700" font-family="Atkinson Hyperlegible, sans-serif">'+esc(sub)+'</text></g>';
  });
  return s+'</svg>';
}

function field(id,label,type,ac,opt,hint){return '<div class="field"><label for="'+id+'">'+label+(opt?' <span class="hint">(opcional)</span>':'')+'</label>'+(hint?'<span class="hint" id="'+id+'-h">'+hint+'</span>':'')+'<input class="input" id="'+id+'" type="'+type+'" autocomplete="'+ac+'"'+(hint?' aria-describedby="'+id+'-h"':'')+'></div>';}

async function spin(){
  if(S.spinning)return;
  const ds=drawState();if(ds.block||!ds.active.length){renderStand(true);return;}
  const m=pick(ds);
  const code=newCode(new Set(S.parts.map(p=>p.code)));
  const part={code,mission:m.id,prize:m.prize,status:"pending",createdAt:Date.now()};
  const btn=document.querySelector('[data-act="spin"]');if(btn)btn.disabled=true;
  try{await S.store.createPart(part);}
  catch(e){toast(e&&e.code==="quota_exceeded"?"O limite de registros foi atingido. Chame a equipe.":"Não foi possível registrar o giro. Verifique a conexão e tente de novo.");if(btn)btn.disabled=false;return;}
  S.myCode=code;S.myPart=part;safeSet("roleta-code",code);S.spinning=true;
  const i=MISSIONS.indexOf(m);
  const target=((360-(i*60+30))%360)+(rnd()*36-18);
  const base=S.rot-(S.rot%360);
  S.rot=base+360*6+target;
  const rot=$("#rot");const dur=reduced()?400:4200;
  if(rot){rot.style.transition="transform "+dur+"ms cubic-bezier(.12,.72,.08,1)";requestAnimationFrame(()=>rot.style.transform="rotate("+S.rot+"deg)");}
  const live=$("#app");
  setTimeout(()=>{const sl=document.getElementById("sl"+i);if(sl&&!reduced())sl.classList.add("slice-win");
    setTimeout(()=>{S.spinning=false;S.lastKey="";renderStand(true);},reduced()?200:1100);},dur+60);
}
async function sendContact(e){

  if(!v("c-name")||!v("c-contact")){err.textContent="Preencha nome e contato para enviar.";return;}
  if(!$("#c-ok").checked){err.textContent="Marque a autorização de contato para enviar.";return;}
  try{await S.store.addContact({name:v("c-name").slice(0,120),org:v("c-org").slice(0,160),contact:v("c-contact").slice(0,160),topic:v("c-topic"),consent:true,code:S.myCode||"",createdAt:Date.now()});
    S.post="thanks";renderStand(true);}
  catch(x){err.textContent="Não foi possível enviar agora. Tente de novo em instantes.";}
}

function panelStock(ds){

  let h='<div class="sec"><h2>Estoque de brindes</h2><p style="margin:0 0 10px;color:var(--ink-soft)">O estoque só diminui quando a entrega é confirmada. Brindes na fila ficam reservados e não entram em novos sorteios.</p><div class="tablewrap"><table><thead><tr><th>Brinde</th><th>Estoque inicial</th><th>Entregues</th><th>Na fila</th><th>Saldo</th><th>Livre para sorteio</th></tr></thead><tbody>';
  for(const k in PRIZES){const s=ds.st[k];
    h+='<tr><td><strong>'+PRIZES[k].name+'</strong></td><td><label class="sr" for="st-'+k+'">Estoque inicial de '+PRIZES[k].name+'</label><input class="input" id="st-'+k+'" data-stock="'+k+'" type="number" min="0" inputmode="numeric" value="'+esc(d[k])+'"></td><td class="num">'+s.delivered+'</td><td class="num">'+s.reserved+'</td><td class="num">'+s.saldo+'</td><td>'+(s.avail>0?'<span class="chip chip-ok">'+s.avail+'</span>':'<span class="chip chip-no">'+(s.saldo<=0?'Esgotado':'0, tudo reservado')+'</span>')+'</td></tr>';}
  h+='</tbody></table></div><div style="margin-top:12px"><button class="btn btn-primary btn-sm" data-act="savestock">Salvar estoque</button></div></div>';
  const actW=MISSIONS.filter(m=>ds.st[m.prize].avail>0&&(Number(w[m.id])||0)>0);const sum=actW.reduce((a,m)=>a+Number(w[m.id]),0);
  h+='<div class="sec"><h2>Frequência das missões</h2><p style="margin:0 0 6px;color:var(--ink-soft)">Peso 0 tira a missão do sorteio. A chance mostrada já considera os brindes livres agora.</p>';
  for(const m of MISSIONS){const wt=Number(w[m.id])||0;const on=ds.st[m.prize].avail>0&&wt>0;
    h+='<div class="wrow"><label for="w-'+m.id+'"><strong>'+m.name+'</strong> <span style="color:var(--ink-soft)">('+PRIZES[m.prize].name+'), peso '+wt+'</span></label><span class="pct">'+(on?Math.round(wt/sum*100)+'%':(ds.st[m.prize].avail<=0?'Sem brinde livre':'Fora'))+'</span><input id="w-'+m.id+'" data-w="'+m.id+'" type="range" min="0" max="10" step="1" value="'+wt+'" style="grid-column:1/-1"></div>';}
  h+='<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary btn-sm" data-act="saveweights">Salvar frequências</button><button class="btn btn-sm" data-act="evenweights">Deixar todas iguais</button></div></div>';
  return h;
}
function panelContacts(){
  if(!S.contacts.length)return '<div class="sec"><p class="empty">Nenhum contato ainda. Os contatos aparecem aqui quando alguém preenche o formulário depois de retirar o brinde.</p></div>';
  let h='<div class="sec"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px"><h2 style="margin:0">'+S.contacts.length+' contatos</h2>'+(S.downloads||S.store.mode==="local"?'<button class="btn btn-sm" data-act="csv">Baixar planilha (CSV)</button>':'')+'</div><div class="tablewrap"><table><thead><tr><th>Nome</th><th>Organização</th><th>Contato</th><th>Assunto</th><th>Horário</th></tr></thead><tbody>';
  for(const c of S.contacts)h+='<tr><td>'+esc(c.name)+'</td><td>'+esc(c.org||"")+'</td><td>'+esc(c.contact)+'</td><td>'+esc(c.topic)+'</td><td>'+esc(new Date(c.createdAt).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}))+'</td></tr>';
  return h+'</tbody></table></div></div>';
}
function panelSettings(){
  const L=S.drafts.links||S.cfg.links,col=S.drafts.color||S.cfg.colors.primary;
  return '<div class="sec grid2">'+
    '<div class="box"><h3>Cor principal</h3><p>Usada na roleta e nos botões. O texto sobre ela escolhe automaticamente a cor com mais contraste.</p><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><label class="sr" for="color">Cor principal</label><input type="color" id="color" value="'+esc(col)+'" style="width:64px;height:52px;border:3px solid var(--line);border-radius:12px;padding:2px;background:var(--card)"><input class="input" id="colorhex" value="'+esc(col)+'" style="width:140px" aria-label="Código da cor"><button class="btn btn-primary btn-sm" data-act="savecolor">Salvar cor</button></div></div>'+
    '<div class="box"><h3>Logo</h3><img src="'+esc(logoSrc())+'" alt="Logo atual" style="height:90px;margin-bottom:10px">'+
      (S.assets?'<p>Envie um PNG, SVG ou WebP.</p><input type="file" id="logofile" accept="image/png,image/svg+xml,image/webp,image/jpeg" class="input" style="padding:10px">':'<p>Para trocar o logo, abra este painel com uma conta que pode editar o artefato.</p>')+
      (S.cfg.logoId?'<button class="btn btn-sm" style="margin-top:8px" data-act="resetlogo">Voltar ao logo padrão</button>':'')+'</div>'+
    '<div class="box"><h3>Links da Virada</h3>'+
      '<div class="field" style="margin-bottom:10px"><label for="l-site">Site (botão “Conhecer a Virada no Café”)</label><input class="input" id="l-site" data-link="site" type="url" placeholder="https://" value="'+esc(L.site)+'"></div>'+
      '<div class="field" style="margin-bottom:10px"><label for="l-contato">Link de contato (WhatsApp, e-mail ou formulário)</label><input class="input" id="l-contato" data-link="contato" type="url" placeholder="https://wa.me/55..." value="'+esc(L.contato)+'"></div>'+
      '<button class="btn btn-primary btn-sm" data-act="savelinks">Salvar links</button></div>'+
    '<div class="box"><h3>PIN do painel</h3><p>'+(S.cfg.pinHash?'O painel pede PIN neste e nos outros aparelhos.':'Sem PIN, qualquer pessoa no tablet consegue abrir o painel.')+'</p><form id="newpin" class="stack"><label class="sr" for="np">Novo PIN</label><input class="input" id="np" type="password" inputmode="numeric" placeholder="Novo PIN (4 a 8 números)" autocomplete="new-password"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary btn-sm" type="submit">Salvar PIN</button>'+(S.cfg.pinHash?'<button class="btn btn-sm" type="button" data-act="lock">Bloquear agora</button>':'')+'</div></form></div>'+
    '<div class="box"><h3>Apagar dados de teste</h3><p>Remove todas as participações e contatos. Use antes de abrir o estande, depois de testar.</p><button class="btn btn-danger btn-sm" data-act="wipe">Apagar participações e contatos</button></div>'+
  '</div>';
}
async function saveCfg(patch,ok){
  const next=mergeCfg(S.cfgRaw);Object.assign(next,patch);
  try{await S.store.saveConfig(next);if(ok)toast(ok);return true;}
  catch(e){toast(e&&e.code==="invalid_argument"?"Esta conta não tem permissão para alterar a configuração.":"Não foi possível salvar. Tente de novo.");return false;}
}
async function setStatus(code,from,to,stamp,msg){
  const got=await S.store.lock(code);
  if(!got){toast("Outra pessoa da equipe está mexendo nesta participação.");return;}
  const p=await S.store.getPart(code).catch(()=>null);
  if(!p){toast("Participação não encontrada.");return;}
  if(!from.includes(p.status)){
    toast(p.status==="delivered"?"Este código já foi retirado às "+hhmm(p.deliveredAt)+".":p.status==="cancelled"?"Esta participação foi cancelada.":"O status mudou. Confira o cartão.");return;}
  const patch={status:to};patch[stamp]=Date.now();
  try{await S.store.updatePart(code,patch);toast(msg);}catch(e){toast("Não foi possível atualizar. Tente de novo.");}
}
async function csv(){
  const rows=[["Nome","Organização","Contato","Assunto","Autorizou retorno","Código","Data"]].concat(S.contacts.map(c=>[c.name,c.org||"",c.contact,c.topic,c.consent?"sim":"não",c.code||"",new Date(c.createdAt).toLocaleString("pt-BR")]));
  const text="\ufeff"+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(";")).join("\r\n");
  const name="contatos-roleta-virada.csv";
  if(S.downloads){try{await S.downloads.save({filename:name,data:text});}catch(e){toast("O download não foi concluído.");}}
  else{toast("Download disponível quando publicado no Claude.");}
}

/* ================= eventos ================= */
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act],[data-tab],[data-val],[data-del],[data-cancel]");if(!t)return;
  const a=t.dataset.act;
  if(t.dataset.tab){S.tab=t.dataset.tab;S.drafts={};renderPanel();return;}
  if(t.dataset.val)return setStatus(t.dataset.val,["pending"],"validated","validatedAt","Resposta validada. Brinde pronto para retirada.");
  if(t.dataset.del){t.disabled=true;return setStatus(t.dataset.del,["validated"],"delivered","deliveredAt","Entrega confirmada.");}
  if(t.dataset.cancel){if(confirm("Cancelar a participação "+t.dataset.cancel+"? O brinde reservado volta para o sorteio."))return setStatus(t.dataset.cancel,["pending","validated"],"cancelled","cancelledAt","Participação cancelada.");return;}
  switch(a){
    case "spin":return spin();
    case "team":location.hash="#/equipe";return;
    case "stand":location.hash="#/";return;
    case "reset":return resetStand();
    case "about":S.post="about";return renderStand(true);
    case "back":S.post=null;return renderStand(true);
    case "contact":S.post="contact";return renderStand(true);
    case "nocontact":S.post=null;return renderStand(true);
    case "pause":return saveCfg({paused:!S.cfg.paused},S.cfg.paused?"Jogo retomado.":"Jogo pausado. Ninguém consegue girar até você retomar.");
    case "savestock":{const s={};for(const k in PRIZES){const v=parseInt((S.drafts.stock||S.cfg.stock)[k],10);s[k]=isNaN(v)||v<0?0:v;}if(await saveCfg({stock:s},"Estoque salvo."))delete S.drafts.stock;renderPanel();return;}
    case "saveweights":{if(await saveCfg({weights:Object.assign({},S.cfg.weights,S.drafts.weights||{})},"Frequências salvas."))delete S.drafts.weights;renderPanel();return;}
    case "evenweights":S.drafts.weights=Object.fromEntries(MISSIONS.map(m=>[m.id,1]));renderPanel();return;
    case "savelinks":{const L=Object.assign({},S.cfg.links,S.drafts.links||{});for(const k in L){L[k]=String(L[k]||"").trim();if(L[k]&&!/^(https?:|mailto:)/i.test(L[k]))L[k]="https://"+L[k];}
      if(await saveCfg({links:L},"Links salvos."))delete S.drafts.links;renderPanel();return;}
    case "savecolor":{const c=(S.drafts.color||S.cfg.colors.primary);if(!/^#[0-9a-f]{6}$/i.test(c)){toast("Use uma cor no formato #RRGGBB.");return;}if(await saveCfg({colors:{primary:c}},"Cor salva."))delete S.drafts.color;return;}
    case "resetlogo":return saveCfg({logoId:null},"Logo padrão restaurado.");
    case "lock":S.unlocked=false;safeSet("roleta-unlock",null);return renderPanel();
    case "csv":return csv();
    case "wipe":{const w=prompt("Isto apaga todas as participações e contatos. Digite APAGAR para confirmar.");if(w&&w.trim().toUpperCase()==="APAGAR"){try{await S.store.wipe();resetStand();toast("Dados apagados.");}catch(x){toast("Não foi possível apagar tudo. Tente de novo.");}}return;}
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"){S.q=t.value;renderPanel();return;}
  if(t.dataset.stock){S.drafts.stock=Object.assign({},S.drafts.stock||S.cfg.stock,{[t.dataset.stock]:t.value});return;}
  if(t.dataset.w){S.drafts.weights=Object.assign({},S.drafts.weights||S.cfg.weights,{[t.dataset.w]:Number(t.value)});const lb=t.parentElement.querySelector("label span");if(lb)lb.textContent="("+PRIZES[MBY[t.dataset.w].prize].name+"), peso "+t.value;return;}
  if(t.dataset.link){S.drafts.links=Object.assign({},S.drafts.links||S.cfg.links,{[t.dataset.link]:t.value});return;}
  if(t.id==="color"){S.drafts.color=t.value;const h=$("#colorhex");if(h)h.value=t.value;return;}
  if(t.id==="colorhex"){S.drafts.color=t.value.trim();return;}
});
document.addEventListener("change",async e=>{
  if(e.target.dataset&&e.target.dataset.w){renderPanel();return;}
  if(e.target.id!=="logofile"||!e.target.files[0]||!S.assets)return;
  try{const r=await S.assets.upload(e.target.files[0]);await saveCfg({logoId:r.id},"Logo atualizado.");}
  catch(x){toast("Não foi possível enviar o logo. Tente PNG ou WebP com até 2 MB.");}
});
document.addEventListener("submit",async e=>{
  if(e.target.id==="cform")return sendContact(e);
  e.preventDefault();
  if(e.target.id==="sform")return;
  if(e.target.id==="pinf"){const v=$("#pin").value.trim();if(v&&await sha(v)===S.cfg.pinHash){S.unlocked=true;safeSet("roleta-unlock","1");renderPanel();}else{$("#pinerr").textContent="PIN incorreto.";$("#pin").value="";}return;}
  if(e.target.id==="newpin"){const v=$("#np").value.trim();if(!/^\d{4,8}$/.test(v)){toast("O PIN precisa ter de 4 a 8 números.");return;}
    if(await saveCfg({pinHash:await sha(v)},"PIN salvo.")){S.unlocked=true;safeSet("roleta-unlock","1");}}
});
addEventListener("hashchange",()=>{S.route=location.hash.startsWith("#/equipe")?"panel":"stand";S.lastKey="";S.drafts={};render();});

function render(){if(S.route==="panel")renderPanel();else renderStand(true);}
function onData(){applyBrand();if(S.route==="panel")renderPanel();else renderStand(false);}

function connect(store){
  S.store=store;
  store.watchConfig(c=>{S.cfgRaw=c?clone(c):null;S.cfg=mergeCfg(S.cfgRaw);S.ready.cfg=true;onData();});
  store.watchParts(ps=>{S.parts=ps.map(p=>Object.assign({},p));
    if(S.myCode){const mine=partByCode(S.myCode);if(mine)S.myPart=mine;}
    S.ready.parts=true;onData();});
  store.watchContacts(cs=>{S.contacts=cs;if(S.route==="panel"&&S.tab==="contatos")renderPanel();});
}

/* ================= início ================= */
applyBrand();render();
let connected=false;
(async()=>{
  if(!window.claude||typeof window.claude.use!=="function"){connect(localStore());return;}
  const db=await window.claude.use("db").catch(()=>null);
  if(db){connect(dbStore(db));connected=true;}
  else connect(localStore());
  render();
  window.claude.use("assets").then(a=>{S.assets=a;if(S.route==="panel")renderPanel();}).catch(()=>{});
  window.claude.use("downloads").then(d=>{S.downloads=d;}).catch(()=>{});
})();
})();
</script>
</body>
